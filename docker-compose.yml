# 本地开发依赖：PostgreSQL + Mailpit（捕获开发环境发出的邮件）
# 启动：docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pa
      POSTGRES_PASSWORD: pa
      POSTGRES_DB: pa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pa -d pa"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # Web UI: http://localhost:8026

volumes:
  pgdata:
